name: Dependency Security Audit

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up patched .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Restore with NuGet audit enabled
        shell: powershell
        run: dotnet restore .\src\ClipForge\ClipForge.csproj -r win-x64 --configfile .\NuGet.config

      - name: Report vulnerable direct and transitive packages
        shell: powershell
        run: dotnet list .\src\ClipForge\ClipForge.csproj package --vulnerable --include-transitive --no-restore

      - name: Compile audited source
        shell: powershell
        run: dotnet build .\src\ClipForge\ClipForge.csproj -c Release -r win-x64 --no-restore
